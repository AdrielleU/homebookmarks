# Site settings. Change these for each site; anything left out uses the default.
# Links and pages live in bookmarks.yaml, next to this file.

title: Home

# Where Enter in the search box goes when no bookmark matches.
searchUrl: https://www.google.com/search?q=

size: medium       # small, medium, or large (or a number: base text size in px)
view: all          # all (every link on the home screen, one column per page) or pages (one page at a time)
viewToggle: true   # show the pages/all button

theme: light       # starting mode: light, dark, or auto (follow the visitor's device)
customize: true    # show the gear menu, where each visitor can pick their own mode, background
                   # and colors (remembered in their browser). These settings are the starting look.
color: slate       # secondary color, tints the page and cards: slate, gray, zinc, neutral, stone, red,
                   # orange, amber, emerald, teal, sky, blue, indigo, violet, purple, rose, or a hex like "#4f46e5"
accent: sky        # primary color, for highlights: any color name above, or a hex in quotes like "#38bdf8"

background:
  # One of the photos that come with the template: alps-clouds, beach, desert-stars,
  # earth-night, forest, gradient-ocean, gradient-rainbow, highlands, misty-hills,
  # mountain-valley, night-sky, red-mountains, starry-peaks, yosemite.
  # Or your own image: put it in config/images/ and write its file name, like
  # my-photo.jpg. "" = plain color. For a different image in each mode, give two:
  #   image:
  #     light: beach
  #     dark: night-sky
  image: ""
  blur: 0          # px
  brightness: 0.7  # 0–1; lower = easier to read: dims the image in dark mode, fades it in light mode
  saturate: 1      # 0 = grayscale, 1 = normal
  cardOpacity: 0.6 # how solid cards are on top of the image (0–1)
  cardBlur: md     # frosted cards, like Homepage: none, xs, sm, md, lg, xl, or a number of px
