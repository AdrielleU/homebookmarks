# Bookmarks. Anyone can edit this file; no code changes needed.
#
# Each top-level key is a page. Its key is the page's address (home -> #/, corp -> #/corp).
# "home" is the start page. Every other page shows up on "home" unless it sets
# `parent:` to another page, which nests it there.
#
# page-key:
#   title: Page name
#   icon: mdi-domain            # optional: an emoji or an icon name (see README)
#   description: Subtitle       # optional
#   parent: home                # optional: the page this one appears under
#   sections:
#     - title: Section name
#       icon: mdi-bank          # optional
#       layout: tiles           # optional: "tiles" = app grid; leave out for a list
#       links:
#         - name: GitHub
#           url: https://github.com
#           icon: github.svg    # optional: an icon name (see README) or a file in config/images/icons/
#           abbr: GH            # optional: text shown when there's no icon
#           desc: Code          # optional: shown under the name
#
# Indent with spaces (not tabs). If a value contains ": " or " #", put it in quotes.

# --- Sample bookmarks: replace with your own. ---

home:
  title: Home
  childrenTitle: Teams
  sections:
    - title: Apps
      layout: tiles
      links:
        - name: Gmail
          url: https://mail.google.com
        - name: Calendar
