# Site settings. Change these for each site; anything left out uses the default.
# Links and pages live in bookmarks.yaml.

title: Home

# Where Enter in the search box goes when no bookmark matches.
searchUrl: https://www.google.com/search?q=

size: medium       # small, medium, or large (or a number: base text size in px)
view: pages        # pages (one page at a time) or all (every link on the home screen, one column per page)
viewToggle: true   # show the pages/all button
search: popup      # popup (Homepage-style quick launch: press / or just start typing) or inline (filter the page)
searchToggle: true # show the popup/inline button

theme: light       # starting mode: light, dark, or auto (follow the visitor's device)
themeToggle: true  # show the light/dark button; each visitor's choice is remembered in their browser
color: slate       # slate, gray, zinc, neutral, stone, red, orange, amber,
                   # emerald, teal, sky, blue, indigo, violet, purple, rose
accent: sky        # any color name above, or a hex in quotes like "#38bdf8"

background:
  # A local image: one from backgrounds/ (alps-clouds, beach, desert-stars, earth-night,
  # forest, gradient-ocean, gradient-rainbow, highlands, misty-hills, mountain-valley,
  # night-sky, red-mountains, starry-peaks, yosemite), e.g. backgrounds/forest.jpg,
  # or your own file such as background.jpg. "" = plain color.
  image: ""
  blur: 0          # px
  brightness: 0.7  # 0–1; lower = easier to read: dims the image in dark mode, fades it in light mode
  saturate: 1      # 0 = grayscale, 1 = normal
  cardOpacity: 0.6 # how solid cards are on top of the image (0–1)
  cardBlur: md     # frosted cards, like Homepage: none, xs, sm, md, lg, xl, or a number of px
