# Self-host with Docker or Podman:  docker compose up -d   (then open http://localhost:8080)
services:
  bookmarks:
    build: .
    image: homebookmarks
    container_name: homebookmarks
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Serve this folder directly, so edits in config/ show up on refresh
      # without rebuilding. Remove this line to serve
      # the copy baked into the image instead.
      # :z lets SELinux hosts (Fedora/RHEL/Alma) read the folder; ignored elsewhere.
      - ./:/usr/share/nginx/html:ro,z
